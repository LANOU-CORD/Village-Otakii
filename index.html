<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Otakii - Maintenance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0d1117; color: white; overflow: hidden; margin: 0; }
        .grid-bg { position: fixed; inset: 0; background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 45px 45px; z-index: -1; }
        .glow-overlay { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; z-index: 0; }
        
        /* Animation de flottement pour l'icône */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        .floating { animation: float 3s ease-in-out infinite; }
        
        .maintenance-card {
            background: rgba(21, 26, 33, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 3rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="grid-bg"></div>

    <!-- Effets visuels d'arrière-plan -->
    <div class="glow-overlay w-96 h-96 bg-blue-600 -top-20 -left-20"></div>
    <div class="glow-overlay w-96 h-96 bg-pink-600 -bottom-20 -right-20"></div>

    <div class="maintenance-card shadow-2xl">
        <div class="floating text-6xl mb-6">🌸</div>
        <h1 class="text-4xl font-extrabold tracking-tighter mb-4">Village Otakii</h1>
        
        <div class="h-1 w-20 bg-pink-500 mx-auto mb-6 rounded-full"></div>
        
        <h2 class="text-xl font-bold text-gray-200 mb-2">Site en Maintenance</h2>
        <p class="text-gray-400 text-sm leading-relaxed mb-8">
            Le village subit actuellement quelques travaux de rénovation. Nous revenons très bientôt avec de nouvelles fonctionnalités !
        </p>

        <div class="space-y-4">
            <div class="bg-white/5 border border-white/10 py-3 px-4 rounded-2xl text-xs font-medium text-pink-400 uppercase tracking-widest">
                Durée : Indéterminée
            </div>
            
            <a href="https://discord.gg/WfbAaqZzTm" target="_blank" 
               class="block w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl transition duration-300 shadow-lg shadow-blue-900/20">
                Rejoindre le Discord
            </a>
        </div>

        <p class="mt-8 text-[10px] text-gray-500 uppercase tracking-widest">
            Merci de votre patience, les ninjas.
        </p>
    </div>

    <!-- Le reste du code est masqué/inactif pendant la maintenance -->
</body>
</html>
